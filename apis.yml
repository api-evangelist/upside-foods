aid: upside-foods
name: UPSIDE Foods
description: 'UPSIDE Foods is a cultivated meat company that grows real chicken directly
  from animal cells instead of raising and slaughtering animals. Starting from a master
  cell bank derived from a single heritage-breed chicken egg, cells are fed vitamins,
  minerals, and nutrients and grown in cultivator tanks, becoming cultivated chicken
  in about three weeks. The company supplies cultivated chicken to foodservice partners
  and is backed by SoftBank Vision Fund and Threshold Ventures. UPSIDE Foods publishes
  no public API, developer portal, or machine-readable interfaces as of July 2026.'
